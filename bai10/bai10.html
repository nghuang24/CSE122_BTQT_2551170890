<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="bai10.css">
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Liên hệ với chúng tôi </h1>
                Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.
            </header>
            <div class="main-content">
                <div class="username">
                    <p>Họ và tên</p>
                    <input type="text" name="username">
                </div>
                <div class="email">
                    <p>Email</p>
                    <input type="email" name="mail">
                </div>
                <div class="cellphone">
                    <p>SĐT</p>
                    <input type="text" name="cellphone">
                </div>
                <div class="topic">
                    <p>Chủ đề</p>
                    <select name="topic" id="">
                        <option>Hỏi về khóa học</option>
                    </select>
                </div>
            </div>
            <div class="request">
                <p>Nội dung</p>
                <textarea name="" id="" cols="30" rows="4"></textarea>
            </div>
            <div class="checkbox">
                <input type="checkbox">
                <p>Tôi đồng ý nhận email phản hồi.</p>
            </div>
            <div class="actions">
                <button class="btn-submit">Gửi liên hệ</button>
                <button class="btn-reset">Nhập lại</button>
            </div>
        </div>
    </body>
</html>
