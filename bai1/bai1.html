    <body>
        <div class="heading">
            <h1>BỐN MÙA</h1>
        </div>
        <div class="k1">
            <p>Xuân về hoa nở khắp trời <br>
                Hạ sang nằng cháy rạng ngời phố quen <br> 
                Thu về lá rụng bên thềm
            </p>
        </div>
        <hr>
        <div class="k2">
            <p>Đông sang gió lạnh bên em đợi chờ <br>
                Bốn mùa là bốn giấc mơ <br>
                Thời gian đi mãi ta chờ đợi ai
            </p>
        </div>
        <hr>
        <div class="k3">
            <p>Một năm rồi laị một năm <br>
                Vẫn còn câu hát thì thầm quê hương <br>
                Chờ xuân nắng mới soi đường
            </p>
        </div>
    </body>
</html>
