<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="bai12.css">
    </head>
    <body>
        <div class="container">
            <div class="calendar-display">
                <p class="year" id="displayYear">2026</p>
                <p class="month" id="displayMonth">Tháng 12</p>
                <p class="date" id="displayDate">24</p>
                <p class="day" id="displayDay">Thứ hai</p>
            </div>
            <div class="greeting">
                <p id="greetingMessage">Chào buổi sáng</p>
            </div>
            <div class="input-calendar">
                <div class="input-group">
                    <label for="inputDate">Ngày</label>
                    <input type="number" id="inputDate" value="24" min="1" max="31">
                </div>
                <div class="input-group">
                     <label for="inputMonth">Tháng</label>
                    <input type="number" id="inputMonth" value="12" min="1" max="12">
                </div>
                <div class="input-group">
                     <label for="inputYear">Năm</label>
                    <input type="number" id="inputYear" value="2026">
                </div>
                <button id="printBtn">In<br>lịch</button>
            </div>
        </div>
        <script src="bai12.js"></script>
    </body>
</html>
