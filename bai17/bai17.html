<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="bai17.css">
</head>

<body>
    <main class="the-form">
        <h1>Đăng ký tài khoản</h1>
        <form id="form-dang-ki" novalidate>
            <div class="truong">
                <!-- Sửa chính tả: Họ vả tên -> Họ và tên -->
                <label for="ho-ten">Họ và tên</label>
                <input type="text" id="ho-ten" placeholder="Nguyễn Văn An">
                <p class="bao-loi" id="loi-ho-ten"></p>
            </div>

            <div class="truong">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="an.nv@example.com">
                <p class="bao-loi" id="loi-email"></p>
            </div>

            <div class="truong">
                <!-- Sửa: for="ho-ten" -> for="mat-khau" -->
                <label for="mat-khau">Mật khẩu</label>
                <input type="password" id="mat-khau" placeholder="******">
                <p class="bao-loi" id="loi-mat-khau"></p>
            </div>

            <div class="truong">
                <label for="xac-nhan">Xác nhận mật khẩu</label>
                <input type="password" id="xac-nhan" placeholder="******">
                <p class="bao-loi" id="loi-xac-nhan"></p>
            </div>

            <p id="thong-bao" class="thong-bao"></p>

            <button type="submit" class="nut-dang-ki">Đăng ký</button>
        </form>
    </main>

    <script src="bai17.js"></script>
</body>

</html>
