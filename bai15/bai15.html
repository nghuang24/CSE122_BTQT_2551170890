<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="bai15.css">
    </head>
    <body>
        <main class="may-tinh">
            <div class="man-hinh">
                <div class="phep-tinh" id="phep-tinh">&nbsp;</div>
                <div class="ket-qua" id="ket-qua">0</div>
            </div>

            <div class="ban-phim" id="ban-phim">
                <button class="nut nut-xoa" data-gia-tri="C">C</button>
                <button class="nut nut-phep" data-gia-tri="%">%</button>
                <button class="nut nut-phep" data-gia-tri="/">/</button>
                <button class="nut nut-phep" data-gia-tri="*">*</button>
                
                <button class="nut" data-gia-tri="7">7</button>
                <button class="nut" data-gia-tri="8">8</button>
                <button class="nut" data-gia-tri="9">9</button>
                <button class="nut nut-phep" data-gia-tri="-">-</button>

                <button class="nut" data-gia-tri="4">4</button>
                <button class="nut" data-gia-tri="5">5</button>
                <button class="nut" data-gia-tri="6">6</button>
                <button class="nut nut-phep" data-gia-tri="+">+</button>

                <button class="nut" data-gia-tri="1">1</button>
                <button class="nut" data-gia-tri="2">2</button>
                <button class="nut" data-gia-tri="3">3</button>
                <button class="nut nut-phep" data-gia-tri="=">=</button>

                <button class="nut nut-rong" data-gia-tri="0">0</button>
                <button class="nut" data-gia-tri=".">.</button>
              
            </div>
        </main>
        <script src="bai15.js"></script>
    </body>
</html>
